name: Extract & Deploy 2016 PCI Services Archive

on:
  workflow_dispatch:
    inputs:
      from_timestamp:
        description: 'Lookback start timestamp'
        required: true
        default: '20150101000000'
      to_timestamp:
        description: 'Target snapshot cutoff (March 13, 2016)'
        required: true
        default: '20160314000000'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  extract_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Original Unaltered Files from Internet Archive
        env:
          FROM_TS: ${{ inputs.from_timestamp }}
          TO_TS: ${{ inputs.to_timestamp }}
        run: |
          pip install requests urllib3
          python3 - << 'EOF'
          import os, time, urllib.parse, requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          session = requests.Session()
          retries = Retry(total=5, backoff_factor=2, status_forcelist=[429, 500, 502, 503, 504])
          session.mount('https://', HTTPAdapter(max_retries=retries))
          session.headers.update({'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})

          from_ts = os.environ.get('FROM_TS', '20150101000000')
          to_ts = os.environ.get('TO_TS', '20160314000000')

          print(f"Querying Wayback CDX API from {from_ts} to {to_ts}...")
          cdx_url = (
              f"https://web.archive.org/cdx/search/cdx?url=pciservices.com/*"
              f"&from={from_ts}&to={to_ts}&output=json"
              f"&fl=timestamp,original,statuscode,mimetype&filter=statuscode:200&collapse=urlkey"
          )

          res = session.get(cdx_url, timeout=90)
          res.raise_for_status()
          rows = res.json()

          snapshots = {}
          for row in rows[1:]:
              ts, orig, status, mime = row
              parsed = urllib.parse.urlparse(orig)
              path = parsed.path if parsed.path else "/"
              snapshots[path] = (ts, orig, mime)

          print(f"Found {len(snapshots)} unique working files/pages. Downloading raw assets...")
          os.makedirs("./archive-site", exist_ok=True)

          for idx, (path, (ts, orig, mime)) in enumerate(snapshots.items(), 1):
              clean_path = path.lstrip("/")
              if not clean_path or path.endswith("/"):
                  local_path = os.path.join("./archive-site", clean_path, "index.html")
              else:
                  _, ext = os.path.splitext(clean_path)
                  if not ext and "html" in mime:
                      local_path = os.path.join("./archive-site", clean_path, "index.html")
                  else:
                      local_path = os.path.join("./archive-site", clean_path)

              os.makedirs(os.path.dirname(local_path), exist_ok=True)
              raw_url = f"https://web.archive.org/web/{ts}id_/{orig}"
              try:
                  r = session.get(raw_url, timeout=30)
                  if r.status_code == 200:
                      with open(local_path, "wb") as f:
                          f.write(r.content)
                      print(f"[{idx}/{len(snapshots)}] Saved: {local_path}")
                  time.sleep(0.1)
              except Exception as e:
                  print(f"[{idx}/{len(snapshots)}] Skipped {orig}: {e}")
          EOF

      - name: Normalize Links to Clean Root-Relative Paths
        run: |
          find ./archive-site -type f \( -name "*.html" -o -name "*.htm" -o -name "*.css" -o -name "*.js" \) -exec sed -i \
            -e 's|https\?://\(www\.\)\?pciservices\.com/|/|g' \
            -e 's|https\?://\(www\.\)\?pciservices\.com|/|g' \
            -e 's|http://ajax.googleapis.com|https://ajax.googleapis.com|g' \
            -e 's|http://fonts.googleapis.com|https://fonts.googleapis.com|g' \
            -e 's|http://code.jquery.com|https://code.jquery.com|g' {} +

          touch ./archive-site/.nojekyll

      - name: Commit Clean Root-Relative Site to Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B archive-files
          git add archive-site/
          git commit -m "Extract clean pciservices.com snapshot" || echo "No changes to commit"
          git push -f origin archive-files

      - name: Upload Clean Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pciservices-2016-static-site
          path: ./archive-site/

      - name: Rewrite Subpaths Specifically for GitHub Pages
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          find ./archive-site -type f \( -name "*.html" -o -name "*.htm" -o -name "*.css" -o -name "*.js" \) -exec sed -i \
            -e "s|href=\"/\([^\"]*\)\"|href=\"/${REPO_NAME}/\1\"|g" \
            -e "s|href='/\([^']*\)'|href='/${REPO_NAME}/\1'|g" \
            -e "s|src=\"/\([^\"]*\)\"|src=\"/${REPO_NAME}/\1\"|g" \
            -e "s|src='/\([^']*\)'|src='/${REPO_NAME}/\1'|g" \
            -e "s|url(/\([^/][^)]*\))|url(/${REPO_NAME}/\1)|g" \
            -e "s|url(\"/\([^\"]*\)\")|url(\"/${REPO_NAME}/\1\")|g" \
            -e "s|url('/\([^']*\)')|url('/${REPO_NAME}/\1')|g" {} +

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './archive-site'

      - name: Deploy Interactive Site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
